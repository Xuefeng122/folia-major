name: iOS 未签名 ipa 构建

on:
  push:
    branches: [ios-ipa]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装依赖
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund

      - name: 安装 Capacitor 依赖
        run: |
          npm i --no-save \
            @capacitor/core@8 \
            @capacitor/ios@8 \
            @capacitor/cli@8 \
            @capacitor/splash-screen@8 \
            @capacitor/status-bar@8

      - name: 构建 Web 产物（capacitor 目标）
        env:
          FOLIA_BUILD_TARGET: capacitor
          VITE_NETEASE_API_BASE: ${{ vars.VITE_NETEASE_API_BASE }}
          VITE_KUGOU_API_BASE: ${{ vars.VITE_KUGOU_API_BASE }}
          VITE_FOLIA_API_BASE: ${{ vars.VITE_FOLIA_API_BASE }}
        run: npm run build

      - name: 生成并同步 iOS 工程
        run: |
          npx cap add ios
          npx cap sync ios

      - name: 编入自带的登录桥（FoliaLoginBridge）
        run: |
          set -e
          SRC=ios-plugin/FoliaLoginBridge.swift
          test -f "$SRC"
          cp "$SRC" ios/App/App/FoliaLoginBridge.swift
          # 自定义插件要按类名登记，Capacitor 才会把 Web 的调用指到这个类。
          node - <<'JS'
          const fs = require('fs');
          const path = 'ios/App/App/capacitor.config.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const names = new Set(config.packageClassList || []);
          names.add('FoliaLoginBridge');
          config.packageClassList = [...names];
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          console.log('packageClassList: ' + config.packageClassList.join(', '));
          JS
          grep -q 'FoliaLoginBridge' ios/App/App/capacitor.config.json
          # 放进目录不等于编进 App：必须进 App target 的编译清单。
          gem install xcodeproj --no-document > /dev/null || gem install xcodeproj --user-install --no-document > /dev/null
          ruby - <<'RB'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.find { |t| t.name == 'App' } or abort('App target 不存在')
          group = project.main_group.find_subpath('App', false) || project.main_group
          name = 'FoliaLoginBridge.swift'
          group.files.select { |f| f.display_name == name }.each(&:remove_from_project)
          file_ref = group.new_reference(name)
          target.source_build_phase.add_file_reference(file_ref)
          project.save
          puts "已加入 #{target.name} target：#{name}"
          RB
          grep -q 'FoliaLoginBridge.swift' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'FoliaLoginBridge.swift in Sources' ios/App/App.xcodeproj/project.pbxproj

      - name: 调整 Info.plist（文件共享 / 横竖屏 / 明文 HTTP）
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$PLIST"
          # 接口地址与音源地址多为用户自建、形如 http://主机:端口，ATS 不放行就到不了。
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoadsInWebContent bool true" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoadsInWebContent true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string Folia 需要访问你在局域网内自建的音乐接口服务。" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationPortraitUpsideDown" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:2 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:3 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationPortraitUpsideDown" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:2 string UIInterfaceOrientationLandscapeLeft" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:3 string UIInterfaceOrientationLandscapeRight" "$PLIST" 2>/dev/null || true
          plutil -p "$PLIST"

      - name: 首次启动用于「文件」App 的 Documents 目录
        run: |
          # UIFileSharingEnabled 只把 App 的 Documents 敞开给「文件」App；一个空的 Documents
          # 是不会出现在「我的 iPhone」下的，所以必须真的建出目录。WebView 里建不了沙盒目录，
          # 于是把创建放进 AppDelegate 的启动入口。
          python3 - <<'PY'
          import pathlib, re, textwrap

          path = pathlib.Path('ios/App/App/AppDelegate.swift')
          source = path.read_text(encoding='utf-8')

          call = 'FoliaDocuments.create()'
          launch = textwrap.dedent('''
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  FoliaDocuments.create()
                  return true
              }
          ''').strip('\n')

          entry = re.search(
              r'func application\(_ application: UIApplication,\s*didFinishLaunchingWithOptions[^{]*\{',
              source,
          )
          if entry:
              if call not in source:
                  source = source[:entry.end()] + '\n        ' + call + source[entry.end():]
          else:
              # 模板没有启动方法时自己写一个：签名一致，UIKit 照样会调它。
              anchor = re.search(r'class AppDelegate[^{]*\{', source)
              if not anchor:
                  raise SystemExit('AppDelegate.swift: the AppDelegate class was not found')
              block = '\n' + textwrap.indent(launch, '    ') + '\n'
              source = source[:anchor.end()] + block + source[anchor.end():]

          helper = textwrap.dedent('''
              /// Creates the folders the「文件」App shows under this app. An app whose Documents is
              /// empty is hidden there, so these are made on every launch: reinstalling the app wipes
              /// the container and they come back with the first start.
              enum FoliaDocuments {
                  static func create() {
                      let manager = FileManager.default
                      guard let documents = manager.urls(for: .documentDirectory, in: .userDomainMask).first else { return }
                      for name in ["Music", "Lyrics", "Mods", "Cache"] {
                          let folder = documents.appendingPathComponent(name, isDirectory: true)
                          var isFolder: ObjCBool = false
                          if manager.fileExists(atPath: folder.path, isDirectory: &isFolder), isFolder.boolValue { continue }
                          try? manager.createDirectory(at: folder, withIntermediateDirectories: true)
                      }
                  }
              }
          ''').strip('\n')
          if 'enum FoliaDocuments' not in source:
              source = source.rstrip() + '\n\n' + helper + '\n'

          path.write_text(source, encoding='utf-8')
          print(source)
          PY
          grep -q 'FoliaDocuments.create()' ios/App/App/AppDelegate.swift
          grep -q 'enum FoliaDocuments' ios/App/App/AppDelegate.swift

      - name: 校验文件访问相关 plist 项
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :UIFileSharingEnabled" "$PLIST" | grep -qi true
          /usr/libexec/PlistBuddy -c "Print :LSSupportsOpeningDocumentsInPlace" "$PLIST" | grep -qi true

      - name: xcodebuild（无签名 Release）
        run: |
          cd ios/App
          ls -la
          if [ -d App.xcworkspace ]; then
            CONTAINER="-workspace App.xcworkspace"
          else
            CONTAINER="-project App.xcodeproj"
          fi
          echo "container=$CONTAINER"
          xcodebuild $CONTAINER \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包 ipa
        run: |
          APP=$(find ios/App/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "app=$APP"
          rm -rf Payload Folia-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/App.app
          codesign -f -s - --deep Payload/App.app || echo "ad-hoc 签名跳过"
          zip -qry Folia-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Folia-unsigned-ipa
          path: Folia-unsigned.ipa
          if-no-files-found: error
